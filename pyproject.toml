# Compassio Python workspace root.
# This root project is not itself a distributable package; it ties together the
# workspace members and holds shared tool configuration and dev dependencies.

[project]
name = "compassio"
version = "0.1.0"
description = "Compassio — climate funding intelligence and decision support (workspace root)."
requires-python = ">=3.12"
dependencies = [
    "compassio-api",
    "compassio-ml",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/compassio_ml"]

[tool.uv.sources]
compassio-api = { workspace = true }
compassio-ml = { workspace = true }

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "packages/compassio_ml/src", "tests"]
extend-exclude = ["apps/web", "data", "models", "experiments"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "BLE",      # no blind `except Exception`
    "S110",     # no try/except/pass
    "PTH",      # prefer pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Alembic-generated migrations keep generated long lines.
"apps/api/src/compassio_api/db/migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
line-ending = "lf"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "packages/compassio_ml/src", "tests"]
mypy_path = ["apps/api/src", "packages/compassio_ml/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "joblib", "joblib.*", "scipy", "scipy.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
markers = [
    "local_data: integration checks that read the real files in data/raw (skipped when absent)",
]
filterwarnings = ["error"]
